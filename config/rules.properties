# =====================================================================
#  COD GUARD - RULES FILE  (edit this file, no coding needed)
#  Save the file and restart the program. Lines starting with # are notes.
# =====================================================================

# ---------- 1. MONEY FACTS (change only if your real costs change) ----------
forward_shipping_inr=65
return_shipping_inr=65
packaging_handling_inr=25
# share of returned parcels that come back damaged (0.08 = 8%)
damaged_return_share=0.08
product_cost_inr=180
# profit % on a delivered order
gross_margin_pct=62
# RTO rate of prepaid orders (0.04 = 4%)
prepaid_rto_rate=0.04
# payment gateway fee on prepaid orders, % of order value
payment_fee_pct=2
# orders per month that are COD (3000 x 55%), used to scale sample results
monthly_cod_orders=1650

# ---------- 2. THE MARKETING vs OPERATIONS DIALS ----------
# Operations: lower these numbers = cancel / confirm MORE orders.
# Marketing: higher these numbers = protect MORE orders.
# "risk" = our estimated chance (0 to 1) that the order comes back as RTO.
# 0.70 means 70% chance of RTO.

# HOLD / CANCEL when risk is at least this
hold_if_risk_at_least=0.70
# same, but for a customer's FIRST order (higher = we protect new customers more)
hold_if_risk_at_least_first_time=0.80
# HOLD when the customer already returned this many earlier orders
hold_if_prior_rto_at_least=2
# SHIP AFTER WHATSAPP CONFIRMATION when risk is at least this
confirm_if_risk_at_least=0.40
# NUDGE TO PREPAID when risk is at least this (and below the confirm level)
nudge_if_risk_at_least=0.25
# below nudge level -> SHIP AS-IS

# true = a junk address (like '.' or 'home') or fake name ('asdf', 'test') ALWAYS needs WhatsApp confirmation,
# even if the score is low, because a courier cannot deliver to it.
confirm_junk_address_or_fake_name=true

# ---------- 3. PREPAID DISCOUNT ----------
# discount is worked out per order from the money saved, then kept inside these limits
min_discount_inr=20
max_discount_inr=60
# we give away at most this share of the money we expect to save
discount_share_of_saving=0.6

# ---------- 4. ASSUMPTIONS used for the Rupee estimates (check with real data later) ----------
# of orders that would have been returned, share stopped by the WhatsApp confirmation
confirm_catches_rto_share=0.50
# of genuine orders, share lost because the customer never confirmed
confirm_loses_genuine_share=0.08
# share of nudged customers who actually switch to prepaid
nudge_acceptance_rate=0.25
# Marketing's point: extra loss (ad spend) when a FIRST-time customer's order is cancelled
first_time_extra_loss_inr=300

# ---------- 5. WHATSAPP ----------
brand_name=YourBrand

# ---------- 6. AI (LLM) ----------
# true = use Claude for address / fake-name checks (needs ANTHROPIC_API_KEY set)
# false = use simple built-in rules only
use_llm=false
llm_model=claude-haiku-5-5
