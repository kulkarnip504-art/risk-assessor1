<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COD Guard - WhatsApp simulator</title>
<style>
  :root{--ink:#1b2230;--soft:#5c6678;--line:#dfe3ea;--paper:#f6f7f9;--card:#fff;--bot:#e4f3ea;--me:#ffffff;--wa:#e9e4da;--accent:#2c7a5f;
    --confirm:#b9801a;--nudge:#3566b0;--hold:#ae3e38;--ship:#2c7a5f;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme:dark){:root{--ink:#eef1f6;--soft:#a3acbd;--line:#2b3342;--paper:#12161e;--card:#1a202b;--bot:#1f3a2e;--me:#2a3140;--wa:#161b24}}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
  main{max-width:1000px;margin:0 auto;padding:24px 20px 50px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media (max-width:760px){main{grid-template-columns:1fr}}
  h1{font:600 18px var(--sans);margin:0 0 4px} h2{font:600 15px var(--sans);margin:18px 0 6px}
  p.hint{color:var(--soft);margin:0 0 10px;font-size:14px} a{color:var(--nudge)}
  input,select,button{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--nudge);outline-offset:2px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:8px} form .wide{grid-column:1/-1} form label{font-size:13px;color:var(--soft);display:grid;gap:2px}
  .orders{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .orders button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
  .orders button:hover{background:var(--paper)}
  .verdict{padding:10px 12px;border-left:4px solid var(--c,var(--line));background:var(--card);border-radius:4px;margin-top:10px;font-size:14px}
  .phone{background:var(--wa);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:560px;overflow:hidden}
  .top{background:var(--accent);color:#fff;padding:10px 14px;font-weight:600} .top small{display:block;font-weight:400;opacity:.85}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:82%;padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
  .m.bot{background:var(--bot);align-self:flex-start} .m.customer{background:var(--me);align-self:flex-end;border:1px solid var(--line)}
  .m.system{align-self:center;background:transparent;color:var(--soft);font-size:13px;text-align:center;max-width:95%;font-style:italic}
  .controls{padding:10px;background:var(--card);border-top:1px solid var(--line);display:grid;gap:8px}
  .row{display:flex;gap:6px;flex-wrap:wrap} .row input{flex:1;min-width:120px}
  .state{font-size:13px;color:var(--soft)}
  .empty{color:var(--soft);padding:30px;text-align:center}
</style>
</head>
<body>
<main>
  <section>
    <h1>WhatsApp simulator</h1>
    <p class="hint">Mock only. No real WhatsApp account. <a href="/">Back to dashboard</a></p>

    <h2>1. Try a new order</h2>
    <form id="f">
      <label>Customer name<input name="name" value="Rohit Kumar"></label>
      <label>Phone<input name="phone" value="9876543210"></label>
      <label class="wide">Address<input name="address" value="home"></label>
      <label>City<input name="city" value="Patna"></label>
      <label>State<select name="state"></select></label>
      <label>Order value (Rs.)<input name="value" type="number" value="649"></label>
      <label>Earlier orders returned<select name="priorRto"><option>0</option><option>1</option><option>2</option></select></label>
      <input type="hidden" name="priorOrders" id="po" value="0">
      <button class="primary wide" type="submit">Check this order</button>
    </form>
    <div id="verdict"></div>

    <h2>2. Or pick an order from last month</h2>
    <p class="hint">Orders sent to "confirmation" or "prepaid nudge". Pick one to start its chat.</p>
    <div class="orders" id="orders"></div>
  </section>

  <section>
    <div class="phone">
      <div class="top"><span id="who">No chat yet</span><small id="kind"></small></div>
      <div class="msgs" id="msgs"><div class="empty">Choose an order on the left to start a chat.</div></div>
      <div class="controls">
        <div class="state" id="state"></div>
        <div class="row"><input id="txt" placeholder="Type a reply as the customer" aria-label="Customer reply"><button class="primary" id="send">Send</button></div>
        <div class="row">
          <button data-q="YES">Yes</button><button data-q="NO">No</button><button data-q="PAY">Pay</button><button data-q="COD">COD</button>
          <button data-q="kya hai ye?">Random text</button>
        </div>
        <div class="row"><button data-t="12">Wait 12 hours</button><button data-t="24">Wait until 24 hours</button></div>
      </div>
    </div>
  </section>
</main>
<script>
const STATES=['Assam','Bihar','Delhi','Karnataka','Madhya Pradesh','Maharashtra','Rajasthan','Tamil Nadu','Telangana','Uttar Pradesh','West Bengal'];
const COLORS={SHIP:'var(--ship)',CONFIRM:'var(--confirm)',NUDGE:'var(--nudge)',HOLD:'var(--hold)'};
const f=document.getElementById('f'); STATES.forEach(s=>f.state.add(new Option(s,s))); f.state.value='Bihar';
let current=null;
const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e};
const post=(u,o)=>fetch(u,{method:'POST',body:new URLSearchParams(o)}).then(r=>r.json());

async function loadOrders(){
  const list=await (await fetch('/api/chat/list')).json(); const box=document.getElementById('orders'); box.replaceChildren();
  list.forEach(o=>{const b=el('button',null,o.id+'  |  '+o.action+'  |  '+Math.round(o.risk)+'% risk  |  Rs.'+o.value); b.onclick=()=>start(o.id); box.append(b)});
}
async function start(id){const c=await post('/api/chat/start',{orderId:id}); show(c)}
function show(c){
  if(c.error){alert(c.error);return}
  current=c.orderId;
  document.getElementById('who').textContent='Order '+c.orderId; document.getElementById('kind').textContent=c.kind;
  document.getElementById('state').textContent='Status: '+c.state+'   |   Time since first message: '+c.hours+'h';
  const m=document.getElementById('msgs'); m.replaceChildren();
  c.messages.forEach(x=>m.append(el('div','m '+x.from,x.text))); m.scrollTop=m.scrollHeight;
}
async function send(t){ if(!current||!t) return; show(await post('/api/chat/reply',{orderId:current,text:t})); document.getElementById('txt').value='' }
document.getElementById('send').onclick=()=>send(document.getElementById('txt').value);
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send(e.target.value)});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{if(current) show(await post('/api/chat/tick',{orderId:current,hours:b.dataset.t}))});

f.addEventListener('submit',async e=>{
  e.preventDefault(); const d=Object.fromEntries(new FormData(f));
  d.priorOrders=d.priorRto>0?String(Number(d.priorRto)+1):'0';
  const r=await post('/api/score',d); const v=document.getElementById('verdict'); v.replaceChildren();
  if(r.error){v.append(el('div','verdict',r.error));return}
  const box=el('div','verdict'); box.style.setProperty('--c',COLORS[r.key]);
  const b=el('b',null,r.action+' ('+Math.round(r.risk)+'% RTO risk)'); box.append(b,el('div',null,r.reason)); v.append(box);
  await loadOrders(); if(r.key==='CONFIRM'||r.key==='NUDGE') start(r.id);
});
loadOrders();
</script>
</body>
</html>
